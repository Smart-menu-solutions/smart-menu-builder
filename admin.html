<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Menu Builder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.sidebar{
    width:260px;
    background:#0f766e;
    color:white;
    padding:25px;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    padding:12px 0;
}

.main{
    flex:1;
    padding:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}
</style>

</head>
<body>

<div class="sidebar">
    <h2>Smart Menu Builder</h2>

    <ul>
        <li>🏠 Dashboard</li>
        <li>🏢 Restaurants</li>
        <li>📋 Menüs</li>
        <li>📱 QR-Codes</li>
        <li>🖼 Galerie</li>
        <li>⚙ Einstellungen</li>
    </ul>
</div>

<div class="main">

    <h1>Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h3>Restaurants</h3>
            <p>1</p>
        </div>

        <div class="card">
            <h3>Menüs</h3>
            <p>1</p>
        </div>

        <div class="card">
            <h3>QR-Codes</h3>
            <p>1</p>
        </div>

    </div>

</div>

</body>
</html>
