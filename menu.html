<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taverna Athens</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

.hero{
    background:#0f766e;
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

.contact{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:20px;
}

.contact a{
    text-decoration:none;
    background:white;
    color:#0f766e;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.category{
    margin-bottom:40px;
}

.category h2{
    margin-bottom:20px;
    color:#0f766e;
}

.item{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.price{
    color:#0f766e;
    font-weight:bold;
    font-size:20px;
    margin-top:10px;
}

</style>

</head>
<body>

<section class="hero">

<h1>Taverna Athens</h1>

<p>Authentische griechische Küche</p>

<div class="contact">

<a href="tel:+30123456789n</a>

<a href/wa.me/30123456789
💬 WhatsApp
</a>

</div>

</section>

<section class="section">

<div class="category">

<h2>🥗 Vorspeisen</h2>

<div class="item">
<h3>Tzatziki</h3>
<p>Hausgemachter Joghurt mit Gurke und Knoblauch</p>
<div class="price">5,90 €</div>
</div>

</div>

<div class="category">

<h2>🍖 Hauptgerichte</h2>

<div class="item">
<h3>Gyros Teller</h3>
<p>Mit Pommes und Tzatziki</p>
<div class="price">14,90 €</div>
</div>

</div>

<div class="category">

<h2>🥤 Getränke</h2>

<div class="item">
<h3>Coca Cola</h3>
<p>0.33L</p>
<div class="price">3,50 €</div>
</div>

</div>

</section>

</body>
</html>
